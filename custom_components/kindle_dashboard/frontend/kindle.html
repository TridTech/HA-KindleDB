<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, initial-scale=1.0">
<title>Home</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff; color: #000;
    width: 600px; min-height: 800px;
    overflow-x: hidden; -webkit-text-size-adjust: 100%;
    /* BODY_FONT injected via JS after parse */
  }

  /* ── STATUS BAR — compact, same height as footer ── */
  #status-bar {
    background: #000; color: #fff;
    padding: 5px 12px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: .04em;
    border-bottom: 2px solid #000;
  }
  #status-bar .loc {
    font-size: 20px; font-weight: bold; letter-spacing: .1em;
    line-height: 1;
  }
  #status-bar .right {
    text-align: right; line-height: 1.4; font-size: 11px;
  }

  /* ── LIGHT STATUS SUMMARY ── */
  #lights-summary {
    border-bottom: 3px solid #000;
    padding: 7px 12px;
    display: flex; align-items: center; gap: 10px; background: #f0f0f0;
  }
  #lights-summary .dot-row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .light-dot {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid #000; background: #fff; display: inline-block; flex-shrink: 0;
  }
  .light-dot.on { background: #000; }
  #lights-summary .summary-text {
    font-size: 11px; flex: 1; line-height: 1.4;
  }
  #lights-summary .summary-text strong { font-size: 13px; display: block; }

  /* ── SECTION LABEL ── */
  .section-label {
    font-size: 10px;
    letter-spacing: .18em; text-transform: uppercase;
    padding: 6px 12px 5px; background: #eee;
    border-bottom: 1px solid #bbb; border-top: 2px solid #000; color: #444;
  }
  .section-label:first-child { border-top: none; }

  /* ── SENSOR GRID — compact, no touch target needed ── */
  .sensor-grid {
    display: grid; gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid #ddd;
  }
  .sensor-tile {
    border: 1px solid #000; padding: 5px 8px 4px; text-align: center;
    background: #fff;
  }
  .sensor-tile .s-label {
    font-size: 9px;
    letter-spacing: .1em; text-transform: uppercase; color: #555;
    margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sensor-tile .s-value {
    font-size: 18px; font-weight: bold; line-height: 1;
    /* inherits body font (set by BODY_FONT injection) */
  }
  /* inline-units: value and unit on same line */
  .sensor-tile .s-value-inline {
    font-size: 18px; font-weight: bold; line-height: 1;
    display: inline;
  }
  .sensor-tile .s-unit-inline {
    font-size: 13px; font-weight: bold; color: #333;
    display: inline; margin-left: 2px;
  }
  /* stacked unit */
  .sensor-tile .s-unit {
    font-size: 12px; font-weight: bold; color: #333;
    margin-top: 1px; line-height: 1;
  }

  /* ── SCENES ── */
  .scenes-grid {
    display: grid; gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid #ddd;
  }
  .scene-btn {
    border: 2px solid #000; background: #fff; padding: 0; cursor: pointer;
    text-align: left; display: flex; flex-direction: column; min-height: 64px;
    overflow: hidden; -webkit-tap-highlight-color: transparent;
  }
  .scene-btn:active, .scene-btn.active-scene { background: #000; color: #fff; }
  .scene-btn:active .scene-icon-bg, .scene-btn.active-scene .scene-icon-bg { background: #222; color: #fff; }
  .scene-btn:active .scene-desc, .scene-btn.active-scene .scene-desc { color: #aaa; }
  .scene-icon-bg {
    background: #eee; width: 100%; padding: 8px 10px 5px;
    font-size: 18px; line-height: 1;
  }
  .scene-body { padding: 5px 10px 8px; }
  .scene-name {
    font-size: 12px; font-weight: bold;
    letter-spacing: .04em; display: block;
  }
  .scene-desc {
    font-size: 10px; color: #666;
    display: block; margin-top: 1px;
  }

  /* ── TOGGLES — large touch targets ── */
  .toggles-list {
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 12px;
    border-bottom: 1px solid #ddd;
  }
  .toggles-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    padding: 10px 12px;
    border-bottom: 1px solid #ddd;
  }
  .toggles-grid .toggle-row { min-height: 48px; }
  .toggles-grid .toggle-label { font-size: 11px; }
  .toggles-grid .toggle-label small { font-size: 9px; }
  .toggle-row {
    border: 2px solid #000; display: flex; align-items: center;
    min-height: 52px; cursor: pointer;
    -webkit-tap-highlight-color: transparent; background: #fff;
  }
  .toggle-row:active { background: #e8e8e8; }
  .toggle-icon {
    width: 48px; min-height: 52px; display: flex; align-items: center;
    justify-content: center; font-size: 18px;
    background: #f0f0f0; border-right: 2px solid #000; flex-shrink: 0;
  }
  .toggle-label {
    flex: 1; padding: 0 10px;
    font-size: 13px; letter-spacing: .04em;
  }
  .toggle-label small {
    display: block; font-size: 10px; color: #666; margin-top: 1px; letter-spacing: .05em;
  }
  .toggle-switch {
    width: 52px; height: 26px; border: 2px solid #000;
    margin-right: 12px; background: #fff; position: relative; flex-shrink: 0;
  }
  .toggle-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; background: #999;
  }
  .toggle-row.on .toggle-switch { background: #000; }
  .toggle-row.on .toggle-switch::after { left: calc(100% - 20px); background: #fff; }

  /* ── FOOTER ── */
  #footer {
    border-top: 2px solid #000; padding: 5px 12px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Courier New', monospace; font-size: 10px; color: #666; letter-spacing: .06em;
  }
  #refresh-btn {
    border: 1px solid #999; background: #fff; padding: 3px 9px;
    font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: .06em; cursor: pointer;
  }
  #refresh-btn:active { background: #000; color: #fff; }

  #toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: #000; color: #fff; font-family: 'Courier New', monospace;
    font-size: 11px; padding: 6px 16px; display: none; white-space: nowrap;
  }
</style>
</head>
<body>

<script>/* __INJECTED_CONFIG__ */</script>

<script>
// Apply font immediately before paint
document.body.style.fontFamily = (typeof BODY_FONT !== "undefined" && BODY_FONT) || "Georgia, serif";
</script>

<div id="status-bar">
  <span class="loc" id="loc-name">HOME</span>
  <div class="right">
    <span id="clock">--:--</span><br>
    <span id="conn-status">connecting…</span>
  </div>
</div>

<!-- Light status strip — only shown when there are light-type toggles -->
<div id="lights-summary" style="display:none">
  <div class="dot-row" id="light-dots"></div>
  <div class="summary-text">
    <strong id="lights-on-count">—</strong>
    <span id="lights-on-names" style="color:#666"></span>
  </div>
</div>

<!-- Dynamic sections rendered here -->
<div id="sections-root"></div>

<div id="footer">
  <span id="last-update">Last updated: —</span>
  <button id="refresh-btn" onclick="fetchAll()">↺ Refresh</button>
</div>
<div id="toast"></div>

<script>
/* ── AUTH ─────────────────────────────────────────── */
function apiHeaders() {
  return {
    "Content-Type": "application/json",
    "Authorization": "Bearer " + HA_TOKEN,
  };
}

/* ── STATE ────────────────────────────────────────── */
let entityStates = {};

/* ── API HELPERS ──────────────────────────────────── */
async function callService(domain, service, entityId) {
  try {
    const r = await fetch(`${HA_URL}/api/services/${domain}/${service}`, {
      method: "POST", headers: apiHeaders(),
      body: JSON.stringify({ entity_id: entityId }),
    });
    if (r.ok) { toast("Done"); setTimeout(fetchAll, 1200); }
    else toast("Error " + r.status);
  } catch(e) { toast("Network error"); }
}

async function fetchState(id) {
  try {
    const r = await fetch(`${HA_URL}/api/states/${id}`, { headers: apiHeaders() });
    return r.ok ? await r.json() : null;
  } catch(e) { return null; }
}

/* ── COLLECT ALL ENTITY IDS ACROSS SECTIONS ───────── */
function allEntityIds() {
  const ids = new Set();
  (SECTIONS || []).forEach(sec => {
    (sec.items || []).forEach(item => {
      if (item.id) ids.add(item.id);
    });
  });
  return [...ids];
}

async function fetchAll() {
  document.getElementById("conn-status").textContent = "loading…";
  const ids = allEntityIds();
  const results = await Promise.all(ids.map(fetchState));
  let anyFail = false;
  results.forEach((d, i) => {
    if (d) entityStates[ids[i]] = d;
    else anyFail = true;
  });
  document.getElementById("conn-status").textContent = anyFail ? "◌ partial" : "● live";
  updateAllSections();
  updateLightSummary();
  document.getElementById("last-update").textContent =
    "Updated: " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

/* ── LIGHT STATUS STRIP ───────────────────────────── */
function buildLightSummary() {
  const lights = [];
  (SECTIONS || []).forEach(sec => {
    if (sec.type === "toggles") {
      (sec.items || []).filter(i => i.id.startsWith("light.") && !i.hide_from_status)
        .forEach(i => lights.push(i));
    }
  });
  const strip = document.getElementById("lights-summary");
  if (!lights.length) { strip.style.display = "none"; return; }
  strip.style.display = "flex";
  const container = document.getElementById("light-dots");
  container.innerHTML = lights.map(l =>
    `<span class="light-dot" id="dot-${l.id.replace(/\./g,'_')}" title="${l.label || l.id}"></span>`
  ).join("");
}

function updateLightSummary() {
  const lights = [];
  (SECTIONS || []).forEach(sec => {
    if (sec.type === "toggles") {
      (sec.items || []).filter(i => i.id.startsWith("light.") && !i.hide_from_status)
        .forEach(i => lights.push(i));
    }
  });
  let onCount = 0, onNames = [];
  lights.forEach(l => {
    const d = entityStates[l.id];
    const on = !!(d && d.state === "on");
    if (on) { onCount++; onNames.push(l.label || l.id); }
    const dot = document.getElementById("dot-" + l.id.replace(/\./g, "_"));
    if (dot) dot.className = "light-dot" + (on ? " on" : "");
  });
  document.getElementById("lights-on-count").textContent =
    onCount === 0 ? "All lights off" : onCount + " light" + (onCount !== 1 ? "s" : "") + " on";
  document.getElementById("lights-on-names").textContent = onNames.join(", ");
}

/* ── BUILD SECTIONS ───────────────────────────────── */
function buildAllSections() {
  const root = document.getElementById("sections-root");
  root.innerHTML = "";
  (SECTIONS || []).forEach((sec, si) => {
    const wrap = document.createElement("div");
    wrap.className = "section-wrap";
    wrap.id = "sec-" + si;

    const lbl = document.createElement("div");
    lbl.className = "section-label";
    lbl.textContent = sec.label || "";
    wrap.appendChild(lbl);

    if      (sec.type === "sensors") buildSensorSection(wrap, sec, si);
    else if (sec.type === "scenes")  buildScenesSection(wrap, sec, si);
    else if (sec.type === "toggles") buildTogglesSection(wrap, sec, si);

    root.appendChild(wrap);
  });
}

function buildSensorSection(wrap, sec, si) {
  const grid = document.createElement("div");
  grid.className = "sensor-grid";
  grid.id = "sensor-grid-" + si;
  const cols = Math.min((sec.items || []).length, 4);
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  const inline = (typeof INLINE_UNITS !== "undefined") ? INLINE_UNITS : false;

  (sec.items || []).forEach((item, ii) => {
    const tile = document.createElement("div");
    tile.className = "sensor-tile";
    tile.id = `sensor-${si}-${ii}`;

    if (inline) {
      tile.innerHTML = `
        <div class="s-label">${item.label || (sec.hide_entity_ids ? '' : item.id)}</div>
        <div><span class="s-value-inline" id="sv-${si}-${ii}">--</span><span class="s-unit-inline">${item.unit || ""}</span></div>`;
    } else {
      tile.innerHTML = `
        <div class="s-label">${item.label || (sec.hide_entity_ids ? '' : item.id)}</div>
        <div class="s-value" id="sv-${si}-${ii}">--</div>
        <div class="s-unit">${item.unit || ""}</div>`;
    }
    grid.appendChild(tile);
  });
  wrap.appendChild(grid);
}

function buildScenesSection(wrap, sec, si) {
  const grid = document.createElement("div");
  grid.className = "scenes-grid";
  const cols = (sec.items || []).length >= 2 ? 2 : 1;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  (sec.items || []).forEach((item, ii) => {
    const btn = document.createElement("button");
    btn.className = "scene-btn";
    btn.id = `scene-${si}-${ii}`;
    btn.innerHTML = `
      <div class="scene-icon-bg">${item.icon || "🎭"}</div>
      <div class="scene-body">
        <span class="scene-name">${item.name || item.id}</span>
        <span class="scene-desc">${item.desc || ""}</span>
      </div>`;
    btn.addEventListener("click", async () => {
      wrap.querySelectorAll(".scene-btn").forEach(b => b.classList.remove("active-scene"));
      btn.classList.add("active-scene");
      await callService("scene", "turn_on", item.entity || item.id);
    });
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);
}

function buildTogglesSection(wrap, sec, si) {
  const list = document.createElement("div");
  list.className = sec.two_columns ? "toggles-grid" : "toggles-list";

  (sec.items || []).forEach((item, ii) => {
    const row = document.createElement("div");
    row.className = "toggle-row";
    row.id = `toggle-${si}-${ii}`;
    row.innerHTML = `
      <div class="toggle-icon">${item.icon || "💡"}</div>
      <div class="toggle-label">
        ${item.label || item.id}
        ${sec.hide_entity_ids ? "" : `<small>${item.id}</small>`}
      </div>
      <div class="toggle-switch"></div>`;
    row.addEventListener("click", async () => {
      const on = row.classList.contains("on");
      row.classList.toggle("on", !on);
      const domain = (item.id || "").split(".")[0] || "light";
      await callService(domain, on ? "turn_off" : "turn_on", item.id);
    });
    list.appendChild(row);
  });
  wrap.appendChild(list);
}

/* ── UPDATE ALL SECTIONS ──────────────────────────── */
function updateAllSections() {
  (SECTIONS || []).forEach((sec, si) => {
    if (sec.type === "sensors") {
      (sec.items || []).forEach((item, ii) => {
        const el = document.getElementById(`sv-${si}-${ii}`);
        if (!el) return;
        const d = entityStates[item.id];
        el.textContent = d
          ? (isNaN(parseFloat(d.state)) ? d.state : Math.round(parseFloat(d.state) * 10) / 10)
          : "--";
      });
    } else if (sec.type === "toggles") {
      (sec.items || []).forEach((item, ii) => {
        const row = document.getElementById(`toggle-${si}-${ii}`);
        if (!row) return;
        const d = entityStates[item.id];
        row.classList.toggle("on", !!(d && d.state === "on"));
      });
    }
  });
}

/* ── CLOCK ────────────────────────────────────────── */
function updateClock() {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.display = "none"; }, 1800);
}

/* ── BOOT ─────────────────────────────────────────── */
document.getElementById("loc-name").textContent =
  (typeof LOCATION !== "undefined" ? LOCATION : "HOME").toUpperCase();

buildLightSummary();
buildAllSections();
updateClock();
setInterval(updateClock, 30000);
fetchAll();
setInterval(fetchAll, 60000);
</script>
</body>
</html>
